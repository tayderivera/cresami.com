<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRESAMI | Refacciones Industriales y Marinas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js"></script>
    
</head>
<body>
    <header>
        <div class="logo-container">
            <img class="logo" src="./media/cresami-transparente.png" alt="CRESAMI Logo">
        </div>
        
        <nav>
            <ul>
                <li>
                    <a href="">Inicio</a>
                </li>
                <li>
                    <a href="#about-us">Nosotros</a>
                </li>
                <li>
                    <a href="">Productos</a>
                </li>
                <li>
                    <a href="">Contacto</a>
                </li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-container">
            <h1>Tus expertos en refacciones industriales y marinas</h1>
            <div class="p-container">
                  <p class="hero-text">Brindamos soluciones para diversas industrias. Garantizamos calidad trabajando con marcas líderes en el mercado y ofreciendo precios competitivos.</p>
            </div>
            <button class="contact-btn">
                <a href="">Contáctanos</a>
            </button>
          
            
        </div>
       
      <div class="triangle"></div>
    </section>

    <section class="carousel">
        <div class="carousel-container">
            <div class="slide active">
                <img src="./media/brands-1.png" alt="">
            </div>
            <div class="slide">
                <img src="./media/brands-2.png" alt="">
            </div>
        </div>
        <button class="prev">&#10094;</button>
        <button class="next">&#10095;</button>
    </section>
    

    
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
